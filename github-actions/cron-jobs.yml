# Replaces vercel.json crons. Calls the Frontend's protected /api/cron/* routes.
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://crm.example.com   (no trailing slash)
#   CRON_SECRET  same value as CRON_SECRET in the DigitalOcean app
# Schedules are UTC (Karachi = UTC+5). GitHub may delay scheduled runs by a few minutes.
name: AKAI cron jobs

on:
  schedule:
    - cron: "*/5 * * * *"   # communications queue + voice-note processing
    - cron: "0 * * * *"     # claim SLA
    - cron: "15 21 * * *"   # loyalty reconciliation (02:15 PKT)
    - cron: "30 21 * * *"   # warranty reminders (02:30 PKT)
  workflow_dispatch:
    inputs:
      job:
        description: "Run one job manually"
        required: true
        type: choice
        options: [communications, voice-notes, claim-sla, loyalty-reconciliation, warranty-reminders, recovery-reminders, admin-reports]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick endpoints
        id: pick
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}${{ inputs.job }}" in
            "schedule:*/5 * * * *") echo "paths=communications voice-notes" >> "$GITHUB_OUTPUT" ;;
            "schedule:0 * * * *")   echo "paths=claim-sla" >> "$GITHUB_OUTPUT" ;;
            "schedule:15 21 * * *") echo "paths=loyalty-reconciliation" >> "$GITHUB_OUTPUT" ;;
            "schedule:30 21 * * *") echo "paths=warranty-reminders" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch:*)    echo "paths=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Call cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          status=0
          for p in ${{ steps.pick.outputs.paths }}; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$p")
            echo "/api/cron/$p -> HTTP $code"; cat /tmp/out.json; echo
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || status=1
          done
          exit $status
